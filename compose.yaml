name: cipherscore-pilot
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: privacy_credit_risk
      POSTGRES_USER: credit_risk_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_risk_app -d privacy_credit_risk"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--aclfile", "/run/secrets/redis_acl"]
    secrets: [redis_acl]
    volumes: [redis_data:/data]
    networks: [data]
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    environment:
      APPLICATION_ENVIRONMENT: production
      APPLICATION_ALLOWED_ORIGINS: ${APPLICATION_ALLOWED_ORIGINS:?Set the HTTPS browser origin}
      MODEL_PLAINTEXT_PREDICTION_ENABLED: "false"
      OPENFHE_ENCRYPTED_API_ENABLED: "true"
      ADMIN_DATABASE_URL_FILE: /run/secrets/database_url
      ADMIN_JWT_SECRET_FILE: /run/secrets/admin_jwt_secret
      OBSERVABILITY_METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets: [database_url, admin_jwt_secret, metrics_token]
    volumes:
      - type: bind
        source: ./deployment/openfhe-public-profile
        target: /app/backend/.runtime/fhe-profiles/ckks-balanced-degree7-v1
        read_only: true
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/liveness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [app, data, monitoring]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    networks: [app]
    restart: unless-stopped
  edge:
    image: nginx:1.27-alpine
    ports: ["8443:443"]
    volumes:
      - ./deployment/edge-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/certs:/etc/nginx/certs:ro
    depends_on: [backend, frontend]
    networks: [app]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets: [metrics_token]
    networks: [monitoring]
    restart: unless-stopped
secrets:
  postgres_password: { file: ./deployment/secrets/postgres_password.txt }
  database_url: { file: ./deployment/secrets/database_url.txt }
  admin_jwt_secret: { file: ./deployment/secrets/admin_jwt_secret.txt }
  metrics_token: { file: ./deployment/secrets/metrics_token.txt }
  redis_acl: { file: ./deployment/secrets/redis_acl.txt }
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
networks:
  app:
  data:
    internal: true
  monitoring:
    internal: true
