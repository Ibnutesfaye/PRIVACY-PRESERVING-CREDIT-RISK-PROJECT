events { worker_connections 1024; }
http {
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    upstream api { server backend:8000; keepalive 16; }
    upstream web { server frontend:8080; }
    server {
        listen 443 ssl http2;
        server_name _;
        server_tokens off;
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 50m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location ~ ^/(api|health) { limit_req zone=api_per_ip burst=40 nodelay; proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location / { proxy_pass http://web; proxy_set_header Host $host; }
    }
}
